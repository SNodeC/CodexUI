name: CI
on: [workflow_dispatch]
permissions: { contents: read }
concurrency:
  group: codexui-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Accepted elapsed-time overruns are reported; correctness/work-count gates remain mandatory.
  CODEXUI_TIMING_POLICY: report

jobs:
  snodec:
    uses: SNodeC/.github/.github/workflows/verify.yml@37b76768a383ea28c03fd9e7ceda7eecf3007c0a # v1.2
  x-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact CodexUI head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.head.sha || github.sha }}
          path: CodexUI/codexui

      - name: Check out AISuite default-branch frontend SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SNodeC/AISuite
          path: AISuite-extraction/AISuite-final

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            AISuite-extraction/AISuite-final/packages/codex-frontend/package-lock.json
            CodexUI/codexui/web/package-lock.json

      - name: Test the frontend SDK
        working-directory: AISuite-extraction/AISuite-final/packages/codex-frontend
        run: |
          npm ci
          npm test
          npm pack --dry-run

      - name: Verify CodexWebUI on Node.js 22
        working-directory: CodexUI/codexui
        run: |
          npm ci --prefix web
          npm test --prefix web

      - name: Select the qualified performance runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0

      - name: Select the qualified browser runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.82/linux64/chrome-linux64.zip \
            --output "$RUNNER_TEMP/codexui-chrome.zip"
          echo "0704631fb3e4f741092e08f55272f90abc3e307f991f05f332924364415b02e0  $RUNNER_TEMP/codexui-chrome.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/codexui-chrome.zip" -d "$RUNNER_TEMP/codexui-browser"
          echo "CHROME_BIN=$RUNNER_TEMP/codexui-browser/chrome-linux64/chrome" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/codexui-browser/chrome-linux64/chrome" --version

      - name: Test CodexWebUI on the qualification runtime
        working-directory: CodexUI/codexui
        run: |
          npm ci --prefix web
          npm test --prefix web

      - name: Profile the presentation model
        id: web-model-profile
        if: ${{ !cancelled() }}
        working-directory: CodexUI/codexui
        run: npm run profile --prefix web

      - name: Build and verify the production browser artifact
        id: web-artifact
        if: ${{ !cancelled() }}
        working-directory: CodexUI/codexui
        run: |
          npm run build:app --prefix web
          npm run verify:artifact --prefix web

      - name: Qualify the production browser application
        id: web-browser
        if: ${{ !cancelled() && steps.web-artifact.outcome == 'success' }}
        working-directory: CodexUI/codexui
        run: npm run qualify:browser --prefix web

      - name: Capture failed web timing diagnostics
        if: ${{ !cancelled() && (steps.web-model-profile.outcome == 'failure' || steps.web-browser.outcome == 'failure') }}
        working-directory: CodexUI/codexui
        run: |
          lscpu
          free -m
          mkdir -p _build/web-profiles
          # Profiled retries are diagnostic only; the mandatory gates above remain failed.
          node --cpu-prof --cpu-prof-interval=100 --cpu-prof-dir=_build/web-profiles web/tools/profile-presentation.mjs || true
          CODEXUI_BROWSER_CPU_PROFILE=_build/web-profiles/browser.cpuprofile node web/tools/qualify-browser.mjs || true

      - name: Upload failed web timing diagnostics
        if: ${{ !cancelled() && (steps.web-model-profile.outcome == 'failure' || steps.web-browser.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-timing-diagnostics
          path: CodexUI/codexui/_build/web-profiles

      - name: Stage and verify the CodexWebUI install
        if: ${{ !cancelled() && steps.web-artifact.outcome == 'success' }}
        working-directory: CodexUI/codexui
        run: |
          cmake -S web -B _build/web-package \
            -DCMAKE_INSTALL_PREFIX="$PWD/_stage/web"
          cmake --build _build/web-package --target codexui-web-artifact
          cmake --install _build/web-package --component CodexWebUI
          test -s _stage/web/share/codexui/web/index.html
          test -n "$(find _stage/web/share/codexui/web/assets -type f -print -quit)"

      - name: Upload CodexWebUI production artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codexui-web
          path: CodexUI/codexui/_stage/web/share/codexui/web
          if-no-files-found: error
