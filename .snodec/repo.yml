# Build specifics only; identity lives in SNodeC/.github/catalog.yml.
ci:
  profile: cpp
  apt:
  - libgit2-dev
  - nodejs
  - npm
  - qt6-base-dev
  - libkf6sonnet-dev
  - sonnet6-plugins
  - kde-style-breeze
  - hunspell-en-us
  - hunspell-de-at
  - xvfb
  - xauth
  deps:
  - snode.c@source
  - AISuite@source
  cmake_options:
  - -DCMAKE_BUILD_TYPE=Debug
  - -DBUILD_TESTING=ON
  - -DCODEXUI_INSTALL_WEB=OFF
  ctest_args:
  - --output-on-failure
  - --verbose
  - --parallel
  - '4'
  ipv6: true
  runtime_dirs: true
  # Hosted runners repeatedly shut down during the 14-job dependency build.
  # Restore the original hosted limits; local qualification retains 14 jobs.
  parallel: 4
  env: {CODEXUI_TIMING_POLICY: report}
  ctest_launcher: [xvfb-run, -a, env, QT_QPA_PLATFORM=offscreen]
